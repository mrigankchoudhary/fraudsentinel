  <text x="24" y="32" font-size="17" font-weight="700" fill="#13203a">Figure 1 — AS-IS fraud alert investigation</text>
  <text x="24" y="52" font-size="11.5" fill="#5d6b85">Manual, sequential, evidence spread across five systems. Median handling time is dominated by evidence gathering, not by judgement.</text>
