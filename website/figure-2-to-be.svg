  <text x="24" y="32" font-size="17" font-weight="700" fill="#13203a">Figure 2 — TO-BE governed agentic process</text>
  <text x="24" y="52" font-size="11.5" fill="#5d6b85">Every activity is badged A (autonomous), H (human-in-the-loop) or E (escalation). A model may escalate a hard flag further; it can never clear one.</text>
