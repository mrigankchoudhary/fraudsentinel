" text-anchor="middle">Input guardrail</text><text x="173.75" y="611.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#5d6b85" text-anchor="middle">schema, masking, injection scan</text><rect x="317.5" y="578" width="267.5" height="42" rx="7" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.4"/><text x="451.25" y="597.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#13203a" text-anchor="middle">Hard-flag rules</text><text x="451.25" y="611.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#5d6b85" text-anchor="middle">HF1-HF3, never downgradable</text><rect x="595.0" y="578" width="267.5" height="42" rx="7" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.4"/><text x="728.75" y="597.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#13203a" text-anchor="middle">Output validator</text><text x="728.75" y="611.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#5d6b85" text-anchor="middle">schema, grounding, numbers</text><rect x="872.5" y="578" width="267.5" height="42" rx="7" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.4"/><text x="1006.25" y="597.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#13203a" text-anchor="middle">Action gate</text><text x="1006.25" y="611.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#5d6b85" text-anchor="middle">approval matrix</text><text x="40" y="638" font-size="9.5" fill="#5d6b85">Governance control: Risk -&gt; Guardrail -&gt; NIST AI RMF requirement -&gt; implementation (docs/governance)</text><path d="M590.0,646 L590.0,655" stroke="#5d6b85" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="24" y="656" width="1132" height="102" rx="9" fill="#e7f0fb" stroke="#dfe5ee" stroke-width="1.2"/><text x="40" y="680" font-size="12" font-weight="700" fill="#1d61b8">Human oversight &amp; audit</text><rect x="40.0" y="690" width="267.5" height="42" rx="7" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.4"/><text x="173.75" y="709.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#13203a" text-anchor="middle">L1 / L2 / admin roles</text><text x="173.75" y="723.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#5d6b85" text-anchor="middle">approval matrix</text><rect x="317.5" y="690" width="267.5" height="42" rx="7" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.4"/><text x="451.25" y="709.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#13203a" text-anchor="middle">10% sampling of auto-decisions</text><text x="451.25" y="723.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#5d6b85" text-anchor="middle">against automation bias</text><rect x="595.0" y="690" width="267.5" height="42" rx="7" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.4"/><text x="728.75" y="709.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#13203a" text-anchor="middle">SLA timeout</text><text x="728.75" y="723.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#5d6b85" text-anchor="middle">auto-escalate, never drop</text><rect x="872.5" y="690" width="267.5" height="42" rx="7" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.4"/><text x="1006.25" y="709.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#13203a" text-anchor="middle">audit_log</text><text x="1006.25" y="723.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#5d6b85" text-anchor="middle">append-only, attributable</text><text x="40" y="750" font-size="9.5" fill="#5d6b85">Governance control: Human decision authority on every non-trivial case</text>
