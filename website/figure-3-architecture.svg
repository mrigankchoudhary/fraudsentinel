sans-serif" font-size="10" fill="#13203a" text-anchor="middle">Risk / Policy</text><text x="728.75" y="387.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#5d6b85" text-anchor="middle">policy + watchlist</text><rect x="872.5" y="354" width="267.5" height="42" rx="7" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.4"/><text x="1006.25" y="373.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#13203a" text-anchor="middle">Recommendation</text><text x="1006.25" y="387.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#5d6b85" text-anchor="middle">outcome + rationale</text><text x="40" y="414" font-size="9.5" fill="#5d6b85">Governance control: Versioned prompts, temperature 0, JSON-only output, NO action tools</text><path d="M590.0,422 L590.0,431" stroke="#5d6b85" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><rect x="24" y="432" width="1132" height="102" rx="9" fill="#f3f0fa" stroke="#dfe5ee" stroke-width="1.2"/><text x="40" y="456" font-size="12" font-weight="700" fill="#4a3aa7">Tools / data</text><rect x="40.0" y="466" width="267.5" height="42" rx="7" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.4"/><text x="173.75" y="485.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10" fill="#13203a" text-anchor="middle">Supabase Postgres</text><text x="173.75" y="499.75" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="9" fill="#5d6b85" text-anchor="middle">synthetic data, RLS</text><rect x="317.5" y="466" width="267.5" height="42" rx="7" fill="#ffffff" stroke="#dfe5ee" stroke-width="1.4"/><text x="451.25" y="485.25" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size=