  <rect width="1180" height="814" fill="#ffffff"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#13203a">Figure 3 — Technical and governance architecture</text>
  <text x="24" y="52" font-size="11.5" fill="#5d6b85">Each layer carries its own control. Governance is a property of the architecture, not a document bolted on beside it.</text>
